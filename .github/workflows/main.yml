name: MCV Discord Notification Bot

on:
  schedule:
    - cron: "0 21 * * *" # Runs at 04:00 AM (UTC+7), sleeps until 08:00
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Create Secrets
        env:
          COOKIE_DATA: ${{ secrets.COOKIE }}
          DISCORD_WEBHOOK_DATA: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$COOKIE_DATA" ]; then
            echo "Error: COOKIE secret is not set!"
            exit 1
          fi
          echo "$COOKIE_DATA" > cookie.txt
          
          if [ -z "$DISCORD_WEBHOOK_DATA" ]; then
            echo "Error: DISCORD_WEBHOOK_URL secret is not set!"
            exit 1
          fi
          echo "$DISCORD_WEBHOOK_DATA" > discord_webhook.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Bot
        env:
          GITHUB_ACTIONS: "true"
        run: |
          python bot.py
